services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  openldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
    environment:
      - LDAP_ORGANISATION=example-com
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
    ports:
      - "389:389"
      - "636:636"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=com' -w admin -b 'dc=example,dc=com' -s base '(objectClass=*)' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_started
      openldap:
        condition: service_healthy

  # Adapter Yandex ID -> OpenID Connect для Identity Brokering в Keycloak.
  # Yandex ID не является OIDC-совместимым (нет id_token в ответе /token, нет sub в userinfo),
  # поэтому брокер Keycloak настраивается на эндпоинты этого shim'а.
  yandex-shim:
    build:
      context: ./yandex-oidc-shim
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-PLACEHOLDER_YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-PLACEHOLDER_YANDEX_CLIENT_SECRET}
      LOGGING_LEVEL_COM_BIONICPRO_YANDEXSHIM: DEBUG
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s


  user-db:
    image: postgres:14
    environment:
      POSTGRES_DB: bionicpro
      POSTGRES_USER: bionicpro
      POSTGRES_PASSWORD: bionicpro
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bionicpro -d bionicpro"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_REALM_URI: http://localhost:8080/realms/reports-realm
      KEYCLOAK_AUTHORIZATION_URI: http://localhost:8080/realms/reports-realm/protocol/openid-connect/auth
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/token
      KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/userinfo
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: grdhgwgwergergh
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2: TRACE
      APP_REDIRECT_URI: http://localhost:3000/login/oauth2/code/keycloak
      USER_API_URI: http://user-api:8080
      REPORT_API_URI: http://report-api:8080
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      bionicpro-auth:
        condition: service_healthy

  user-api:
    build:
      context: ./user-api
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      KEYCLOAK_REALM_URI: http://localhost:8080/realms/reports-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      USER_DB_HOST: user-db
      USER_DB_PORT: "5432"
      USER_DB_NAME: bionicpro
      USER_DB_USER: bionicpro
      USER_DB_PASSWORD: bionicpro
    depends_on:
      user-db:
        condition: service_healthy

  # CRM БД (эмуляция Битрикс24): клиенты и заказанные/выданные протезы.
  # Источник данных №1 для ETL отчётов
  crm-db:
    image: postgres:14
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      - "5435:5432"
    volumes:
      - crm-db-data:/var/lib/postgresql/data
      - ./db/crm:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  # «База данных (PostgreSQL)» из исходной C4: телеметрия с чипов протезов
  # (чип шлёт её через 4G). Источник данных №2 для ETL отчётов
  telemetry-db:
    image: postgres:14
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    ports:
      - "5436:5432"
    volumes:
      - telemetry-db-data:/var/lib/postgresql/data
      - ./db/telemetry:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20

  # OLAP-база для витрины отчётности
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: bionicpro
      CLICKHOUSE_PASSWORD: bionicpro
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # native
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user bionicpro --password bionicpro --query 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  # ---------- Apache Airflow 3.x (ETL CRM + телеметрия -> ClickHouse) ----------
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

  x-airflow-common: &airflow-common
    # Кастомный образ: официальный Airflow 3 + psycopg2 (источники PG)
    # и clickhouse-connect (OLAP-приём). DAG-файлы — в ./airflow/dags
    build:
      context: ./airflow
    env_file:
      - .env
    environment:
      &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      # общий redis проекта (celery — db 1, сессии bionicpro-auth — db 0)
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-yYq-b6R5_-4AmZVTVduKqgEE4PrLBEFkso2ROt83fRU=}
      # DAG не ставим на паузу при создании, чтобы расписание работало сразу;
      # catchup=false в самом DAG не даёт бэкилла за всё прошлое
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
      AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
      AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
      # Подключения к источникам ETL (см. dags/bionicpro_report_etl.py)
      CRM_DB_HOST: crm-db
      CRM_DB_PORT: "5432"
      CRM_DB_NAME: crm
      CRM_DB_USER: crm
      CRM_DB_PASSWORD: crm
      TELEMETRY_DB_HOST: telemetry-db
      TELEMETRY_DB_PORT: "5432"
      TELEMETRY_DB_NAME: telemetry
      TELEMETRY_DB_USER: telemetry
      TELEMETRY_DB_PASSWORD: telemetry
      CLICKHOUSE_HOST: clickhouse
      # clickhouse-connect работает по HTTP-протоколу
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: bionicpro
      CLICKHOUSE_PASSWORD: bionicpro
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/config:/opt/airflow/config
      - ./airflow/plugins:/opt/airflow/plugins
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      &airflow-common-depends-on
      redis:
        condition: service_healthy
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    healthcheck:
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD set AIRFLOW_UID in .env to your uid,"
          echo "otherwise files in dags/logs/config/plugins will be owned by uid 50000."
          echo
        fi
        echo "Creating missing opt dirs if missing:"
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Running airflow config list to create default config file if missing."
        /entrypoint airflow config list >/dev/null
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID:-50000}:0"
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        ls -la /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    user: "0:0"

  minio:
    image: cr.yandex/mirror/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bionicpro
      MINIO_ROOT_PASSWORD: bionicpro
    ports:
      - "9002:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  minio-init:
    image: cr.yandex/mirror/minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bionicpro bionicpro &&
      mc mb --ignore-existing local/reports &&
      mc anonymous set download local/reports &&
      mc ilm rule add --expiry-days 30 local/reports
      "
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"


  cdn:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/bionicpro-cdn.conf:/etc/nginx/conf.d/bionicpro-cdn.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - cdn-cache:/var/cache/nginx
    depends_on:
      minio:
        condition: service_healthy

  # ---------- report-api: бэкенд отчётов (читает витрину в ClickHouse) ----------
  report-api:
    build:
      context: ./report-api
      dockerfile: Dockerfile
    ports:
      - "8085:8080"
    environment:
      KEYCLOAK_REALM_URI: http://localhost:8080/realms/reports-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: bionicpro
      CLICKHOUSE_PASSWORD: bionicpro
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: reports
      S3_ACCESS_KEY: bionicpro
      S3_SECRET_KEY: bionicpro
      CDN_BASE_URL: http://localhost:8088
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  redis-data:
  user-db-data:
  crm-db-data:
  telemetry-db-data:
  clickhouse-data:
  airflow-db-data:
  minio-data:
  cdn-cache:
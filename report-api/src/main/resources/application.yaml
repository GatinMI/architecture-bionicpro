spring:
  application:
    name: report-api

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_REALM_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI}

clickhouse:
  url: jdbc:clickhouse://${CLICKHOUSE_HOST:clickhouse}:${CLICKHOUSE_PORT:8123}/${CLICKHOUSE_DB:bionicpro}
  user: ${CLICKHOUSE_USER:bionicpro}
  password: ${CLICKHOUSE_PASSWORD:bionicpro}


s3:
  endpoint: ${S3_ENDPOINT:http://minio:9000}
  region: ${S3_REGION:us-east-1}
  bucket: ${S3_BUCKET:reports}
  access-key: ${S3_ACCESS_KEY:bionicpro}
  secret-key: ${S3_SECRET_KEY:bionicpro}

cdn:
  base-url: ${CDN_BASE_URL:http://localhost:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info

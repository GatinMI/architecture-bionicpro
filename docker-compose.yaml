services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  openldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
    environment:
      - LDAP_ORGANISATION=example-com
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
    ports:
      - "389:389"
      - "636:636"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=example,dc=com' -w admin -b 'dc=example,dc=com' -s base '(objectClass=*)' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_started
      openldap:
        condition: service_healthy

  # Adapter Yandex ID -> OpenID Connect для Identity Brokering в Keycloak.
  # Yandex ID не является OIDC-совместимым (нет id_token в ответе /token, нет sub в userinfo),
  # поэтому брокер Keycloak настраивается на эндпоинты этого shim'а.
  yandex-shim:
    build:
      context: ./yandex-oidc-shim
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-PLACEHOLDER_YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-PLACEHOLDER_YANDEX_CLIENT_SECRET}
      LOGGING_LEVEL_COM_BIONICPRO_YANDEXSHIM: DEBUG
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s


  user-db:
    image: postgres:14
    environment:
      POSTGRES_DB: bionicpro
      POSTGRES_USER: bionicpro
      POSTGRES_PASSWORD: bionicpro
    ports:
      - "5434:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bionicpro -d bionicpro"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_REALM_URI: http://localhost:8080/realms/reports-realm
      KEYCLOAK_AUTHORIZATION_URI: http://localhost:8080/realms/reports-realm/protocol/openid-connect/auth
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/token
      KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/userinfo
      KEYCLOAK_CLIENT_ID: bionicpro-auth
      KEYCLOAK_CLIENT_SECRET: grdhgwgwergergh
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2: TRACE
      APP_REDIRECT_URI: http://localhost:3000/login/oauth2/code/keycloak
      USER_API_URI: http://user-api:8080
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      bionicpro-auth:
        condition: service_healthy

  user-api:
    build:
      context: ./user-api
      dockerfile: Dockerfile
    ports:
      - "8083:8080"
    environment:
      KEYCLOAK_REALM_URI: http://localhost:8080/realms/reports-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      USER_DB_HOST: user-db
      USER_DB_PORT: "5432"
      USER_DB_NAME: bionicpro
      USER_DB_USER: bionicpro
      USER_DB_PASSWORD: bionicpro
    depends_on:
      user-db:
        condition: service_healthy

volumes:
  redis-data:
  user-db-data: